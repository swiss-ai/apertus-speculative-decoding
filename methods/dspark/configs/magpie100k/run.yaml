train:
  speculator_type: dspark
  verifier:
    verifier_name_or_path: /capstor/scratch/cscs/zyu/spec/hf/hub/models--swiss-ai--Apertus-v1.5-8B/snapshots/a411d838600baf0e3635a3daf66fb7c55fc97bb6
  draft:
    num_layers: 5
    target_layer_ids:
    - 1
    - 8
    - 15
    - 22
    - 29
  data:
    data_path: /capstor/scratch/cscs/zyu/spec/runs/apertus_dspark_scale/data
    hidden_states_backend: file
    total_seq_len: 16384
    max_anchors: 1024
  generation:
    vllm_endpoint: http://localhost:8000/v1
    on_missing: generate
    on_generate: cache
  loss:
    loss_implementation: eager
    loss_fn: '{"ce":0.1,"tv":0.9}'
  optimizer:
    optimizer: muon
    lr: 0.0003
  trainer:
    epochs: 10
    checkpoint_freq: 0.5
    save_path: /capstor/scratch/cscs/zyu/spec/runs/apertus_dspark_scale/ckpt_run1
  dflash:
    block_size: 8
  dspark:
    markov_rank: 256
    enable_confidence_head: true
    confidence_head_with_markov: true
  backend:
    hidden_states_path: /capstor/scratch/cscs/zyu/spec/runs/apertus_dspark_scale/hs_cache
