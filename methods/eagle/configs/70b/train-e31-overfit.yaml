# Tiny-overfit (32 conversations). Teacher-force mix assistant text on the
# frozen 70B target, then train an E3.1 head from scratch. Do not flip flags
# onto an E3 run. Override paths on the allocated GPU job if needed.
#
# One-node layout: materialize features with HF TP=4 / device_map, stop the
# teacher, train the head on the same node from the offline replay dir.

model:
  target_model_path: /capstor/store/cscs/swissai/infra01/hf_models/models/swiss-ai/Apertus-v1.5-70B
  trust_remote_code: true
  draft_model_config: methods/eagle/configs/70b/draft-e31-config.json
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  norm_key: model.language_model.norm.weight
  freeze_lm_head: false
  target_model_backend: hf

dataset:
  train_data_path: results/70b/eagle/data/torchspec/overfit.jsonl
  eval_data_path: results/70b/eagle/data/torchspec/overfit.jsonl
  chat_template: apertus
  renderer: apertus
  prompt_key: conversations
  shuffle_dataset: true

training:
  attention_backend: sdpa
  micro_batch_size: 1
  draft_accumulation_steps: 16
  learning_rate: 1.0e-4
  max_grad_norm: 0.5
  max_seq_length: 4096
  num_epochs: 200
  num_train_steps: 400
  seed: 1
  training_num_gpus_per_node: 4
  training_num_nodes: 1
  ttt_length: 7
  warmup_ratio: 0.015
  save_interval: 50
  eval_interval: 20

inference:
  inference_engine_type: hf
  inference_num_gpus: 4
  inference_num_gpus_per_engine: 4
  inference_num_gpus_per_node: 4
  inference_batch_size: 1
  max_sample_pool_size: 32
  inference_buffer_threshold: 8
  aux_hidden_states_layers: [1, 39, 76]
  last_hidden_states_prenorm: false
  offline:
    data_path: results/70b/eagle/replay/overfit-e31
    num_engines: 1

output_dir: results/70b/eagle/heads/e31-overfit
cache_dir: results/70b/eagle/cache/e31-overfit

limits:
  max_optimizer_steps_pilot: 400
  max_epochs_substantive: 3
  stop_after_evals_without_improvement: 3
  accumulation_field: training.draft_accumulation_steps
  accumulation_semantics: audit_before_launch_per_rank_vs_global
