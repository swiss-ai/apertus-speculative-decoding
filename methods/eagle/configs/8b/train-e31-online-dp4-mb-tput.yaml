# Throughput test, not a recipe replay: 4 GPUs x 32 sequences per step (~65k tokens,
# the DSpark step size) with padded micro-batches, to measure tokens/s.
# Loss curves are not comparable to the 16-sequence replays (8x larger steps, same lr).
pipeline: rollout
stage: 8b

model:
  contract: targets/8b/contract.json
  algorithm: eagle31
  draft_model_config: methods/eagle/configs/8b/draft-e31-config.json
  freeze_lm_head: true
  share_target_embedding: true

dataset:
  features: online
  data_root: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b-online-dp4-mb-tput
  train_data: [/iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b-mix10k/generated/train.jsonl]
  eval_data: [/iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b-mix10k/generated/validation.jsonl]
  max_seq_length: 4096
  # One padded target forward per group of up to 32k tokens (sorted by length).
  teacher_batch_tokens: 32768
  # Online records must equal the cache the 10k head was trained on.
  online_check:
    cache: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b-mix10k/features/validation
    rows: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b-mix10k/generated/validation.jsonl
    samples: 32

training:
  attention_backend: sdpa
  loss_type: forward_kl
  ttt_length: 7
  micro_batch_size: 1
  # Per rank; 4 ranks x 4 = the recipe's 16 sequences per optimizer step.
  draft_accumulation_steps: 32
  data_parallel: 4
  # Sequences of a step sorted by length into right-padded rows of up to 8k tokens.
  micro_batch_tokens: 8192
  learning_rate: 1.0e-4
  warmup_ratio: 0.015
  max_grad_norm: 0.5
  weight_decay: 0.0
  lr_decay_style: cosine
  min_lr: 0.0
  gradient_checkpointing: false
  num_train_steps: 60
  # Same schedule length as e31-mix10k, so step-for-step learning rates match.
  lr_total_steps: 1875
  num_epochs: 3
  eval_interval: 60
  save_interval: 0
  stop_after_evals_without_improvement: 0
  seed: 1

output_root: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/runs
head_root: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/heads
run_name: e31-online-dp4-mb-tput
