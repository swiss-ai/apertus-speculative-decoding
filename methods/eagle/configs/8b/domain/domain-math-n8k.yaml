# Domain drafters (A3), EAGLE arm "math".
# Generated by methods/eagle/launch/domain/make-configs.py; do not edit by hand.
# Recipe = adapt-mult-n8k-r0 (drafter-updates); only the training file differs.
pipeline: rollout
stage: 8b

model:
  contract: targets/8b/contract.json
  algorithm: eagle31
  draft_model_config: methods/eagle/configs/8b/draft-e31-config.json
  freeze_lm_head: true
  share_target_embedding: true
  # Published e10 export (HF faruk-zahiragic/Apertus-v1.5-8B-EAGLE3.1-e10-thinking-off
  # @4c9d4c9e, SHA256SUMS verified); the trainer checkpoint was scratch-cleaned.
  init_from: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/init/eagle-e10-thinkoff-hf

dataset:
  features: online
  data_root: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/eagle
  train_data:
    - /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/traces/math/train.jsonl
  eval_data: [/iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/traces/math/dev.jsonl]
  extra_eval:
    - name: code
      data: [/iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/traces/code/dev.jsonl]
    - name: chat
      data: [/iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/traces/chat/dev.jsonl]
    - name: summarization
      data: [/iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/traces/summarization/dev.jsonl]
    - name: multilingual
      data: [/iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/traces/multilingual/dev.jsonl]
    - name: tool
      data: [/iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/traces/tool/dev.jsonl]
    - name: opb
      data: [/iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/opb/heldout.jsonl]
      limit: 512
  max_seq_length: 8192
  teacher_batch_tokens: 32768

training:
  attention_backend: sdpa
  loss_type: forward_kl
  ttt_length: 7
  micro_batch_size: 1
  rows_per_step: 32
  data_parallel: 4
  micro_batch_tokens: 8192
  gradient_checkpointing: adaptive
  checkpoint_free_width: 4096
  checkpoint_free_tokens: 8192
  learning_rate: 3.0e-5
  warmup_ratio: 0.05
  max_grad_norm: 0.5
  weight_decay: 0.0
  lr_decay_style: constant
  min_lr: 0.0
  lr_total_steps: 384
  num_train_steps: 384
  num_epochs: 1000
  eval_interval: 64
  save_interval: 128
  resume_interval: 128
  stop_after_evals_without_improvement: 0
  stop_margin_s: 600
  seed: 1

export:
  checkpoint: final

output_root: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/eagle/runs
head_root: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/domain-drafters/eagle/heads
run_name: domain-math-n8k
