# A3 expansion (the plan's single allowed one): 10,000 target-regenerated
# conversations, same mix and recipe as train-e31-mix.yaml, at most 3 epochs,
# stop after 3 evaluations without improvement. The 1k mixed pilot plateaued at
# held-out simulated acceptance length 0.44 (corpus-limited).
# Driver: methods/eagle/apertus_eagle/train_rollout.py (TorchSpec Eagle3Model).
pipeline: rollout
stage: 8b

model:
  contract: targets/8b/contract.json
  algorithm: eagle31
  draft_model_config: methods/eagle/configs/8b/draft-e31-config.json
  # Seed from the target lm_head and freeze (TorchSpec freeze_lm_head path).
  freeze_lm_head: true
  # Export without embed_tokens: vLLM then shares the target's full input
  # embedding, so prompts with literal multimodal tokens stay in range.
  share_target_embedding: true

dataset:
  data_root: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b-mix10k
  source_splits: results/8b/eagle/data-mix10k
  generate_splits: [validation, train]
  extract_splits: [validation, train]
  parity_split: none  # target-only property, confirmed in results/8b/eagle/preflight/feature-parity.json
  train_cache: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b-mix10k/features/train
  eval_cache: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b-mix10k/features/validation
  max_seq_length: 4096

training:
  attention_backend: sdpa
  loss_type: forward_kl
  ttt_length: 7
  micro_batch_size: 1
  draft_accumulation_steps: 16
  learning_rate: 1.0e-4
  warmup_ratio: 0.015
  max_grad_norm: 0.5
  weight_decay: 0.0
  lr_decay_style: cosine
  min_lr: 0.0
  gradient_checkpointing: false
  num_train_steps: 1875
  num_epochs: 3
  eval_interval: 100
  save_interval: 500
  stop_after_evals_without_improvement: 3
  seed: 1

output_root: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/runs
head_root: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/heads
run_name: e31-mix10k

verify:
  prompts: workloads/8b/eagle-8b-validation.jsonl
  limit: 128
  max_tokens: 512
  num_speculative_tokens: 3
