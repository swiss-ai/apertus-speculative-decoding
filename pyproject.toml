[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apertus-speculative-decoding"
version = "0.1.0"
description = "Reproducible speculative-decoding benchmarks for Apertus v1.5"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Swiss AI Initiative" }]
dependencies = [
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9,<4"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
apertus-bench = "apertus_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apertus_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
