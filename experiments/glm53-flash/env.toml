# GLM-5.3-Flash serving environment (one GH200 node, TP4 + expert parallel).
# vLLM 0.30.0+gced6857af in this CI image registers Glm5NextForConditionalGeneration,
# the glm5_next_mtp speculative type and DFlash2DraftModel (checked 2026-11-20).
image = "/capstor/store/cscs/swissai/infra01/container-images/ci/vllm_nvidia_alps-arm64.sqsh"

mounts = [
  "/capstor",
  "/iopsstor",
  "/users",
  "/usr/lib64/libhwloc.so.15:/usr/lib/libhwloc.so.15",
  "/usr/lib64/libpciaccess.so.0:/usr/lib/libpciaccess.so.0",
  "/usr/lib64/libxml2.so.2:/usr/lib/libxml2.so.2",
  "/usr/lib64/libnuma.so.1:/usr/lib/libnuma.so.1",
]

workdir = "/iopsstor/scratch/cscs/faruk_zahiragic/glm53-specdec/repo"

# Single node only: TP/EP traffic stays on NVLink, so no libfabric/CXI hooks
# (a hook variant that does not match the image would break startup).
[env]
PYTHONNOUSERSITE = "1"
VLLM_ALLREDUCE_USE_SYMM_MEM = "0"
