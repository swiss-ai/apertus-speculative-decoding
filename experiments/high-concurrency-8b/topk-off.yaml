# Sampling and top-k on one GPU, thinking off: greedy, Apertus' default
# (T 0.7 / top-p 0.8 / top-k 20), and T 1.0 (Yu's protocol) with top-k
# none / 50 / 20 / 5; top_p 1.0 and top_k -1 are explicit so the model's
# generation defaults do not apply. No seed: seeded requests take vLLM's
# per-request sampling path, which would distort the sampler cost under load.
# normal, SWEEP_TIME 06:00:00.
name: topk-off
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
loadtests:
  - label: opb-greedy
    workload: opb
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/opb-heldout.jsonl
