# Prefill/decode disaggregation on one node, on decode-heavy prompts (held-out
# and Arena-Hard; 9 Oct tested only summarization): 1 prefill + 3 decode GPUs
# and 2 + 2, plain and with each thinking-off drafter on both roles (NIXL),
# against plain DP4 in the same job. normal, SWEEP_TIME 05:00:00.
name: pd
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
loadtests:
  - workload: opb
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/opb-heldout.jsonl
    concurrencies: [4, 32, 64, 128, 256, 512, 1024]
  - workload: arena-hard-clean
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/arena-hard.jsonl
    concurrencies: [4, 32, 64, 128, 256, 512, 1024]
  - workload: arena-hard-contaminated
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/arena-hard.jsonl
    concurrencies: [4, 32, 64, 128, 256, 512, 1024]
arms:
  - {name: plain-dp4, method: baseline, engine: {data_parallel_size: 4}}
  - {name: pd-1p3d-plain, method: pd, serve_method: baseline, decode: {count: 3}, pythonpath: [/iopsstor/scratch/cscs/faruk_zahiragic/pydeps/nixl-1.5.0]}
  - {name: pd-1p3d-dspark-off-k3, method: pd, serve_method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 3, decode: {count: 3}, pythonpath: [/iopsstor/scratch/cscs/faruk_zahiragic/pydeps/nixl-1.5.0]}
  - {name: pd-1p3d-eagle-k3, method: pd, serve_method: eagle, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/heads/e31-opb-thinkoff-stage1-se, k: 3, decode: {count: 3}, pythonpath: [/iopsstor/scratch/cscs/faruk_zahiragic/pydeps/nixl-1.5.0]}
  - {name: pd-2p2d-plain, method: pd, serve_method: baseline, prefill: {count: 2}, decode: {count: 2}, pythonpath: [/iopsstor/scratch/cscs/faruk_zahiragic/pydeps/nixl-1.5.0]}
  - {name: pd-2p2d-dspark-off-k3, method: pd, serve_method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 3, prefill: {count: 2}, decode: {count: 2}, pythonpath: [/iopsstor/scratch/cscs/faruk_zahiragic/pydeps/nixl-1.5.0]}
  - {name: pd-2p2d-eagle-k3, method: pd, serve_method: eagle, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/heads/e31-opb-thinkoff-stage1-se, k: 3, prefill: {count: 2}, decode: {count: 2}, pythonpath: [/iopsstor/scratch/cscs/faruk_zahiragic/pydeps/nixl-1.5.0]}
