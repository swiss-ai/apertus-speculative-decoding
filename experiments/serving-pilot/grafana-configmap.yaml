apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-dspark-pilot
  namespace: rob-poc
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Speculative Decoding
data:
  dspark-pilot.json: |
    {
      "uid": "apertus-dspark-pilot",
      "title": "Apertus DSpark research pilot",
      "schemaVersion": 39,
      "version": 1,
      "tags": [
        "apertus",
        "speculative-decoding"
      ],
      "editable": true,
      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "utc",
      "panels": [
        {
          "id": 1,
          "title": "Output tokens per second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(vllm:generation_tokens_total{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval]))",
              "legendFormat": "Output tokens per second"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Request completions per second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(vllm:request_success_total{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval]))",
              "legendFormat": "Request completions per second"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Draft acceptance",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(vllm:spec_decode_num_accepted_tokens_total{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval])) / sum(rate(vllm:spec_decode_num_draft_tokens_total{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval]))",
              "legendFormat": "Draft acceptance"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Mean acceptance length including bonus",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 + sum(rate(vllm:spec_decode_num_accepted_tokens_total{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval])) / sum(rate(vllm:spec_decode_num_drafts_total{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval]))",
              "legendFormat": "Mean acceptance length including bonus"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "TTFT p50",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5,sum by(le)(rate(vllm:time_to_first_token_seconds_bucket{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval])))",
              "legendFormat": "TTFT p50"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "TTFT p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95,sum by(le)(rate(vllm:time_to_first_token_seconds_bucket{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval])))",
              "legendFormat": "TTFT p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "Request latency p50",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5,sum by(le)(rate(vllm:e2e_request_latency_seconds_bucket{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval])))",
              "legendFormat": "Request latency p50"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "title": "Request latency p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95,sum by(le)(rate(vllm:e2e_request_latency_seconds_bucket{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval])))",
              "legendFormat": "Request latency p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "title": "Inter token latency p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95,sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval])))",
              "legendFormat": "Inter token latency p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "title": "Running requests",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(vllm:num_requests_running{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"})",
              "legendFormat": "Running requests"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "title": "Queued requests",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(vllm:num_requests_waiting{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"})",
              "legendFormat": "Queued requests"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "title": "KV cache usage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 35
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(vllm:kv_cache_usage_perc{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"})",
              "legendFormat": "KV cache usage"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "title": "Preemptions per second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 42
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(vllm:num_preemptions_total{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval]))",
              "legendFormat": "Preemptions per second"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "title": "GPU memory used",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 42
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(DCGM_FI_DEV_FB_USED{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"})",
              "legendFormat": "GPU memory used"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decmbytes"
            },
            "overrides": []
          }
        },
        {
          "id": 15,
          "title": "GPU utilization",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 49
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(DCGM_FI_DEV_GPU_UTIL{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"})",
              "legendFormat": "GPU utilization"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          }
        },
        {
          "id": 16,
          "title": "Draft acceptance by position",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 49
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(position)(rate(vllm:spec_decode_num_accepted_tokens_per_pos_total{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval])) / ignoring(position) group_left sum(rate(vllm:spec_decode_num_drafts_total{model=~\"$model\",slurm_job_id=~\"$slurm_job_id\"}[$__rate_interval]))",
              "legendFormat": "{{position}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          }
        }
      ],
      "description": "Select a model and its Slurm deployment. Plain serving has no acceptance counters. Missing counters remain no data. Request failure counts and client-observed latency are retained in raw benchmark artifacts; k6 results provide offered load and dropped iterations. Deployment manifests retain hashes and expiry.",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          },
          {
            "name": "model",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(vllm:num_requests_running,model)",
            "refresh": 1,
            "multi": false,
            "includeAll": false
          },
          {
            "name": "slurm_job_id",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(vllm:num_requests_running{model=~\"$model\"},slurm_job_id)",
            "refresh": 1,
            "multi": false,
            "includeAll": false
          }
        ]
      }
    }
