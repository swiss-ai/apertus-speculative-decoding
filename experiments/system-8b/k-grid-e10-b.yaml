# Draft-length grid on summarization and chat for EAGLE e10 (the k-grid-a/b
# rerun on the final head; DSpark e10 is in calibrate, sched-smoke and
# k-grid-a/b). Own plain arm.
name: k-grid-e10-b
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
probe: false
loadtests:
  - workload: summarization
    concurrencies: [1, 8, 32, 64, 128, 256]
  - workload: chat
    concurrencies: [1, 8, 32, 64, 128, 256]
arms:
  - {name: plain, method: baseline}
  - {name: eagle-e10-k4, method: eagle, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/heads/e31-opb-thinkoff-stage1-se, k: 4}
  - {name: eagle-e10-k5, method: eagle, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/heads/e31-opb-thinkoff-stage1-se, k: 5}
  - {name: eagle-e10-k7, method: eagle, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/heads/e31-opb-thinkoff-stage1-se, k: 7}
