# Per-request verification lengths make decode batches non-uniform, which the
# default cudagraph_mode (FULL_AND_PIECEWISE) runs with piecewise graphs
# (sched-smoke: threshold mode ~1.75x slower per step on the probe). Here every
# batch shape up to the largest capture size uses full graphs
# (FlashAttention 3 supports varlen batches in them); plain and fixed k=7 show
# what the mode itself changes.
# Submit with SWEEP_PATCHES=serving/patches/vllm-apertus-dspark-confidence-verify.patch
name: verify-cgfull
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
probe: true
loadtests:
  - workload: summarization
    concurrencies: [1, 8, 32, 64, 128, 256]
  - workload: chat
    concurrencies: [1, 8, 32, 64, 128, 256]
arms:
  - {name: plain-cgfull, method: baseline, vllm_args: [--compilation-config.cudagraph_mode, FULL]}
  - {name: dspark-e10-k7-cgfull, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 7, vllm_args: [--compilation-config.cudagraph_mode, FULL]}
  - name: dspark-e10-k7-thr05-cgfull
    method: dspark
    drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final
    k: 7
    vllm_args: [--compilation-config.cudagraph_mode, FULL]
    env: {VLLM_DSPARK_VERIFY_SCHED: 1, VLLM_DSPARK_VERIFY_MODE: threshold, VLLM_DSPARK_VERIFY_THRESHOLD: 0.5}
  - name: dspark-e10-k7-thr03-cgfull
    method: dspark
    drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final
    k: 7
    vllm_args: [--compilation-config.cudagraph_mode, FULL]
    env: {VLLM_DSPARK_VERIFY_SCHED: 1, VLLM_DSPARK_VERIFY_MODE: threshold, VLLM_DSPARK_VERIFY_THRESHOLD: 0.3}
