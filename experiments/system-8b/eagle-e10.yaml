# EAGLE 3.1 after all 10 epochs (best checkpoint, step 251,955, head exported
# by the pipeline with --drop-embed-tokens) against epoch 3, DSpark e10 and
# plain, all in one job, as eagle-e3: probe, Yu's held-out prompts, chat and
# summarization. The DSpark arm also anchors this job to eagle-e3 (job 3630557).
name: eagle-e10
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
probe: true
loadtests:
  - workload: opb
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/opb-heldout.jsonl
    concurrencies: [1, 8, 32, 128]
  - workload: chat
    concurrencies: [1, 8, 32, 128]
  - workload: summarization
    concurrencies: [1, 8, 32, 128]
arms:
  - {name: plain, method: baseline}
  - {name: dspark-e10-k7, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 7}
  - {name: eagle-e3-k7, method: eagle, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/heads/e31-opb-thinkoff-stage1-ep3-se, k: 7}
  - {name: eagle-e10-k7, method: eagle, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-eagle/8b/heads/e31-opb-thinkoff-stage1-se, k: 7}
