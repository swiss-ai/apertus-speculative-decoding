# Qwen3 workload-shape environment (one GH200 node, TP=1 engines, one per GPU).
# CI image with vLLM 0.30.0 (as experiments/qwen3-235b/env.toml): it serves the
# speculators-format DSpark (qwen3_dspark.py), EAGLE-3 and DFlash (qwen3_dflash.py)
# heads for Qwen3 targets. The capture, the HF teacher-forced shape stage and the
# served gate all use it. The submitters replace workdir with the checkout they run from.
image = "/capstor/store/cscs/swissai/infra01/container-images/ci/vllm_nvidia_alps-arm64.sqsh"

mounts = [
  "/capstor",
  "/iopsstor",
  "/users",
  "/usr/lib64/libhwloc.so.15:/usr/lib/libhwloc.so.15",
  "/usr/lib64/libpciaccess.so.0:/usr/lib/libpciaccess.so.0",
  "/usr/lib64/libxml2.so.2:/usr/lib/libxml2.so.2",
  "/usr/lib64/libnuma.so.1:/usr/lib/libnuma.so.1",
]

workdir = "/iopsstor/scratch/cscs/faruk_zahiragic/spec-exp"

# Single GPU per process: no libfabric/CXI hooks.
[env]
PYTHONNOUSERSITE = "1"
VLLM_ALLREDUCE_USE_SYMM_MEM = "0"
