train:
  speculator_type: dspark
  verifier:
    verifier_name_or_path: /capstor/store/cscs/swissai/infra01/hf_models/models/swiss-ai/Apertus-v1.5-70B
  draft:
    num_layers: 5
    target_layer_ids:
    - 1
    - 20
    - 39
    - 58
    - 77
  data:
    data_path: /iopsstor/scratch/cscs/faruk_zahiragic/apertus-dspark70b/data
    hidden_states_backend: file
    total_seq_len: 8192
    num_workers: 1
    prefetch_factor: 1
    max_anchors: 512
  generation:
    vllm_endpoint: http://localhost:8001/v1
    on_missing: generate
    on_generate: delete
  loss:
    loss_implementation: eager
    loss_fn: '{"ce":0.1,"tv":0.9}'
  optimizer:
    optimizer: muon
    lr: 0.0006
  trainer:
    epochs: 10
    checkpoint_freq: 0.015625
    save_path: /iopsstor/scratch/cscs/faruk_zahiragic/beverin-feasibility/runs/scaling-16n-20261027-rocblas/checkpoints
    fsdp_shard: true
  dflash:
    block_size: 8
  dspark:
    markov_rank: 256
    enable_confidence_head: true
    confidence_head_with_markov: true
  backend:
    hidden_states_path: /tmp/hidden_states
