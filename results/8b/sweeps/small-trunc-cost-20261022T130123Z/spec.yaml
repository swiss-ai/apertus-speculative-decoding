# Shallow DSpark drafters (docs/small-drafter.md), phase A: the draft step's
# cost by draft length and request count for 5/3/2/1-layer drafters, from the
# cost table the paper scheduler profiles at engine start (cost-table.json,
# draft_ms_by_len; vllm-apertus-dspark-draft-cut.patch). The truncated e10
# drafters are untrained; only the table is used. A short C=1 pass keeps
# the arms up long enough to finish profiling.
# Submit with SWEEP_PATCHES="serving/patches/vllm-apertus-dspark-confidence-verify.patch
#   serving/patches/vllm-apertus-dspark-paper-scheduler.patch
#   serving/patches/vllm-apertus-dspark-draft-cut.patch
#   serving/patches/vllm-apertus-dspark-kv-cost.patch
#   serving/patches/vllm-apertus-dspark-num-layers.patch"
name: small-trunc-cost
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
probe: false
loadtests:
  - workload: opb
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/opb-heldout.jsonl
    concurrencies: [1]
arms:
  - {name: dspark-e10-l5, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 7, env: {VLLM_DSPARK_VERIFY_SCHED: 1, VLLM_DSPARK_VERIFY_MODE: paper, VLLM_DSPARK_DRAFT_CUT: 1, VLLM_DSPARK_KV_COST: 1, VLLM_DSPARK_VERIFY_PROFILE: "{arm_dir}/cost-table.json", VLLM_DSPARK_STS: "{repo}/methods/dspark/scheduler/sts-dspark-e10-8b.json"}}
  - {name: trunc-l3, method: dspark, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/small-drafter/drafters/dspark-e10-trunc-l3, k: 7, env: {VLLM_DSPARK_VERIFY_SCHED: 1, VLLM_DSPARK_VERIFY_MODE: paper, VLLM_DSPARK_DRAFT_CUT: 1, VLLM_DSPARK_KV_COST: 1, VLLM_DSPARK_VERIFY_PROFILE: "{arm_dir}/cost-table.json", VLLM_DSPARK_STS: "{repo}/methods/dspark/scheduler/sts-dspark-e10-8b.json"}}
  - {name: trunc-l2, method: dspark, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/small-drafter/drafters/dspark-e10-trunc-l2, k: 7, env: {VLLM_DSPARK_VERIFY_SCHED: 1, VLLM_DSPARK_VERIFY_MODE: paper, VLLM_DSPARK_DRAFT_CUT: 1, VLLM_DSPARK_KV_COST: 1, VLLM_DSPARK_VERIFY_PROFILE: "{arm_dir}/cost-table.json", VLLM_DSPARK_STS: "{repo}/methods/dspark/scheduler/sts-dspark-e10-8b.json"}}
  - {name: trunc-l1, method: dspark, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/small-drafter/drafters/dspark-e10-trunc-l1, k: 7, env: {VLLM_DSPARK_VERIFY_SCHED: 1, VLLM_DSPARK_VERIFY_MODE: paper, VLLM_DSPARK_DRAFT_CUT: 1, VLLM_DSPARK_KV_COST: 1, VLLM_DSPARK_VERIFY_PROFILE: "{arm_dir}/cost-table.json", VLLM_DSPARK_STS: "{repo}/methods/dspark/scheduler/sts-dspark-e10-8b.json"}}
