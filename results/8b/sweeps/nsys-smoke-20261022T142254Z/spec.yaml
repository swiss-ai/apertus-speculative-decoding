# Smoke test of the Nsight Systems harness (docs/waste-profiling.md): DSpark
# e10 k=7 and plain, each with an unprofiled and a profiled twin, on Yu's
# held-out prompts at C=8 and C=128, the levels eagle-e10 (job 3709465) recorded
# for both. The unprofiled arms check the harness against that record; the twins
# give the profiling overhead. Each profiled arm first records in nsys-env.txt
# whether GPU-metrics sampling and ncu counters are allowed.
# Submit with SWEEP_PARTITION=debug SWEEP_TIME=00:30:00 (no SWEEP_PATCHES; the
# NVTX overlay serving/patches/vllm-apertus-nvtx.patch is added automatically).
name: nsys-smoke
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
probe: false
loadtests:
  - workload: opb
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/opb-heldout.jsonl
    concurrencies: [8, 128]
arms:
  - {name: plain, method: baseline}
  - {name: plain-nsys, method: baseline, profile: {tool: nsys, window_s: 10, delay_s: 5}}
  - {name: dspark-e10-k7, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 7}
  - name: dspark-e10-k7-nsys
    method: dspark
    drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final
    k: 7
    profile: {tool: nsys, window_s: 10, delay_s: 5}
