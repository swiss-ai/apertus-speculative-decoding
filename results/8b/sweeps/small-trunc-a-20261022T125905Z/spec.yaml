# Shallow DSpark drafters (docs/small-drafter.md), phase A: DSpark e10 cut to
# its first 3/2/1 layers (methods/dspark/train/truncate_drafter.py, untrained)
# against the 5-layer e10, fixed k=7, on the held-out prompts. Measures the
# load of an N-layer drafter (KV pool, running requests, step time) and the
# acceptance left after the cut. Drafters on scratch (truncation.json there).
# Submit with SWEEP_PATCHES="serving/patches/vllm-apertus-dspark-num-layers.patch"
name: small-trunc-a
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
probe: false
loadtests:
  - workload: opb
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/opb-heldout.jsonl
    concurrencies: [1, 64, 256]
arms:
  - {name: dspark-e10-k7, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 7}
  - {name: trunc-l3-k7, method: dspark, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/small-drafter/drafters/dspark-e10-trunc-l3, k: 7}
  - {name: trunc-l2-k7, method: dspark, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/small-drafter/drafters/dspark-e10-trunc-l2, k: 7}
  - {name: trunc-l1-k7, method: dspark, drafter: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/small-drafter/drafters/dspark-e10-trunc-l1, k: 7}
