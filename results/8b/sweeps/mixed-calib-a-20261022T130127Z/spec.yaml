# Per-request draft length (docs/per-request-k.md), step A2: the heterogeneous
# "mixed" workload (tools/make-mixed-workload.py; 576 rows: Open-PerfectBlend
# held-out, chat, summarization, Arena-Hard clean, probe math and code, each
# row labelled and sending its label as vllm_xargs {"task": ...}; cluster
# only, manifest in workloads/8b/mixed.manifest.json). This job measures the
# fixed draft lengths k=3/5 against plain on it and collects a labelled
# confidence dump: DSpark e10 at k=7 verifying every slot with the head
# loaded, writing logits, verified/accepted counts, context and task label per
# verification (serving/patches/vllm-apertus-dspark-conf-dump-task.patch) at
# every concurrency, for methods/dspark/scheduler/headroom_sim.py. k=1/2/4 in
# mixed-calib-b. The k=7 arm's throughput includes the dump's overhead.
# Submit with SWEEP_PARTITION=normal SWEEP_TIME=02:00:00
#   SWEEP_PATCHES="serving/patches/vllm-apertus-dspark-confidence-verify.patch
#   serving/patches/vllm-apertus-dspark-paper-scheduler.patch
#   serving/patches/vllm-apertus-dspark-draft-cut.patch
#   serving/patches/vllm-apertus-dspark-kv-cost.patch
#   serving/patches/vllm-apertus-dspark-conf-dump-task.patch"
name: mixed-calib-a
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
probe: false
loadtests:
  - workload: mixed
    workloads_file: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp/per-request-k/workloads/8b/mixed.jsonl
    concurrencies: [1, 8, 32, 64, 128, 256]
arms:
  - {name: plain, method: baseline}
  - {name: dspark-e10-k3, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 3}
  - {name: dspark-e10-k5, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 5}
  - name: dspark-e10-k7-dump
    method: dspark
    drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final
    k: 7
    env: {VLLM_DSPARK_VERIFY_SCHED: 1, VLLM_DSPARK_VERIFY_MODE: none, VLLM_DSPARK_CONF_DUMP: "{arm_dir}/conf-dump.jsonl"}
