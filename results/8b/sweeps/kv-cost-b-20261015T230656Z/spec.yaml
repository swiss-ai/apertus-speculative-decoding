# Second job of kv-cost-a.yaml, with the arms in reverse order (swapped GPUs).
# Submit with SWEEP_PATCHES="serving/patches/vllm-apertus-dspark-confidence-verify.patch
#   serving/patches/vllm-apertus-dspark-paper-scheduler.patch
#   serving/patches/vllm-apertus-dspark-draft-cut.patch
#   serving/patches/vllm-apertus-dspark-kv-cost.patch"
name: kv-cost-b
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
probe: false
loadtests:
  - workload: opb
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/opb-heldout.jsonl
    concurrencies: [1, 8, 32, 64, 128, 256]
arms:
  - name: dspark-e10-k7-paper-cut-kv
    method: dspark
    drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final
    k: 7
    env: {VLLM_DSPARK_VERIFY_SCHED: 1, VLLM_DSPARK_VERIFY_MODE: paper, VLLM_DSPARK_DRAFT_CUT: 1, VLLM_DSPARK_KV_COST: 1, VLLM_DSPARK_VERIFY_PROFILE: "{arm_dir}/cost-table.json", VLLM_DSPARK_STS: "{repo}/methods/dspark/scheduler/sts-dspark-e10-8b.json"}
  - name: dspark-e10-k7-paper-cut
    method: dspark
    drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final
    k: 7
    env: {VLLM_DSPARK_VERIFY_SCHED: 1, VLLM_DSPARK_VERIFY_MODE: paper, VLLM_DSPARK_DRAFT_CUT: 1, VLLM_DSPARK_VERIFY_PROFILE: "{arm_dir}/cost-table.json", VLLM_DSPARK_STS: "{repo}/methods/dspark/scheduler/sts-dspark-e10-8b.json"}
  - {name: dspark-e10-k3, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 3}
  - {name: plain, method: baseline}
