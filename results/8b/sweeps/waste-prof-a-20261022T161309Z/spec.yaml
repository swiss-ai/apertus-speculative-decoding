# Wasted-compute profiles (docs/waste-profiling.md), part a: Nsight Systems
# traces with NVTX ranges and GPU metrics, one 10 s window per level, on Yu's
# held-out prompts and summarization. Plain and DSpark e10 k=1/3/7. Profiled
# arms only: throughput headlines come from the unprofiled records (k-grid-opb-a/b,
# k-grid-e10-a/b, calibrate, waste-sum-a/b). Part b holds DSpark k=5 and EAGLE e10.
# Submit with SWEEP_PARTITION=normal SWEEP_TIME=02:00:00 (no SWEEP_PATCHES; the
# NVTX overlay is added automatically).
name: waste-prof-a
stage: 8b
engine: {max_num_batched_tokens: 16384, max_num_seqs: 256}
probe: false
loadtests:
  - workload: opb
    workloads_file: /users/faruk_zahiragic/apertus-spec-decoding/workloads/8b/opb-heldout.jsonl
    concurrencies: [1, 8, 32, 64, 128, 256]
  - {workload: summarization, concurrencies: [1, 8, 32, 64, 128, 256]}
arms:
  - {name: plain, method: baseline, profile: {tool: nsys, window_s: 10, delay_s: 8, gpu_metrics: true, gpu_metrics_frequency: 1000}}
  - {name: dspark-e10-k1, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 1, profile: {tool: nsys, window_s: 10, delay_s: 8, gpu_metrics: true, gpu_metrics_frequency: 1000}}
  - {name: dspark-e10-k3, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 3, profile: {tool: nsys, window_s: 10, delay_s: 8, gpu_metrics: true, gpu_metrics_frequency: 1000}}
  - {name: dspark-e10-k7, method: dspark, drafter: /capstor/store/cscs/swissai/infra01/speculative-decoding/DSpark_Apertus_1.5_8B/dspark_apertus15-8b_open-perfectblend_thinking-off_2026-10-04_epoch10_final, k: 7, profile: {tool: nsys, window_s: 10, delay_s: 8, gpu_metrics: true, gpu_metrics_frequency: 1000}}
