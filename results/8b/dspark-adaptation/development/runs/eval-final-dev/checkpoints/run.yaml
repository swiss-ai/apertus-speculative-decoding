train:
  speculator_type: dspark
  seed: 1
  verifier:
    verifier_name_or_path: /capstor/store/cscs/swissai/infra01/hf_models/models/swiss-ai/Apertus-v1.5-8B
  draft:
    from_pretrained: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/dspark-adaptation/adapt-mult-n8k-r0-20261104/head
    target_layer_ids:
    - 1
    - 8
    - 15
    - 22
    - 29
  data:
    data_path: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/dspark-adaptation/adapt-mult-n8k-r0-20261104/data/prepared-train
    hidden_states_backend: file
    total_seq_len: 9344
    train_data_ratio: 0.969
    num_workers: 8
    prefetch_factor: 4
    max_anchors: 1024
  generation:
    vllm_endpoint: http://localhost:8001/v1
    on_missing: generate
    on_generate: delete
  loss:
    loss_implementation: eager
    loss_fn: '{"ce":0.1,"tv":0.9}'
  optimizer:
    optimizer: muon
    lr: 0.0
  trainer:
    epochs: 1
    checkpoint_freq: 1.0
    save_path: /iopsstor/scratch/cscs/faruk_zahiragic/spec-exp-data/dspark-adaptation/adapt-mult-n8k-r0-20261104/runs/eval-final-dev/checkpoints
    max_steps: 1
  dflash:
    block_size: 8
  dspark:
    markov_rank: 256
    enable_confidence_head: true
    confidence_head_with_markov: true
  backend:
    hidden_states_path: /tmp/hidden_states
