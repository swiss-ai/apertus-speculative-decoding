# Qwen3-235B-A22B-Instruct-2507-FP8 serving environment (one GH200 node, TP4).
# Same CI image as the GLM-5.3-Flash sweep (branch experiment/glm53-flash-specdec):
# vLLM 0.30.0+gced6857af, which serves Qwen3MoeForCausalLM and loads
# speculators-format EAGLE3 heads.
image = "/capstor/store/cscs/swissai/infra01/container-images/ci/vllm_nvidia_alps-arm64.sqsh"

mounts = [
  "/capstor",
  "/iopsstor",
  "/users",
  "/usr/lib64/libhwloc.so.15:/usr/lib/libhwloc.so.15",
  "/usr/lib64/libpciaccess.so.0:/usr/lib/libpciaccess.so.0",
  "/usr/lib64/libxml2.so.2:/usr/lib/libxml2.so.2",
  "/usr/lib64/libnuma.so.1:/usr/lib/libnuma.so.1",
]

workdir = "/iopsstor/scratch/cscs/faruk_zahiragic/qwen3-235b-specdec/repo"

# Single node only: TP traffic stays on NVLink, so no libfabric/CXI hooks.
[env]
PYTHONNOUSERSITE = "1"
VLLM_ALLREDUCE_USE_SYMM_MEM = "0"
