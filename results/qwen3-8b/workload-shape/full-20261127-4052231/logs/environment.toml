# Qwen3-8B workload-shape study (replay and validation gate), one GH200 node, TP1 engines.
# Same CI image as the Qwen3-235B and GLM-5.3-Flash runs: vLLM 0.30.0, which serves
# speculators-format EAGLE-3 (method eagle3) and DFlash (method dflash, qwen3_dflash.py)
# drafters. The submitters replace workdir with the checkout they run from.
image = "/capstor/store/cscs/swissai/infra01/container-images/ci/vllm_nvidia_alps-arm64.sqsh"

mounts = [
  "/capstor",
  "/iopsstor",
  "/users",
  "/usr/lib64/libhwloc.so.15:/usr/lib/libhwloc.so.15",
  "/usr/lib64/libpciaccess.so.0:/usr/lib/libpciaccess.so.0",
  "/usr/lib64/libxml2.so.2:/usr/lib/libxml2.so.2",
  "/usr/lib64/libnuma.so.1:/usr/lib/libnuma.so.1",
]

workdir = "/iopsstor/scratch/cscs/faruk_zahiragic/spec-exp/workload-shape-qwen3-8b/code-fabc7d1a73b0"

# Single node, no cross-node NCCL: no libfabric/CXI hooks.
[env]
PYTHONNOUSERSITE = "1"
VLLM_ALLREDUCE_USE_SYMM_MEM = "0"
