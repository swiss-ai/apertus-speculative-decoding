# EAGLE-3 control. Same data order / seed / widths as train-e31.yaml.
# Run inside the pinned TorchSpec checkout on an allocated GPU job after T3.
# Do not convert an E3.1 checkpoint by flipping fc_norm/norm_output.

model:
  target_model_path: /capstor/store/cscs/swissai/infra01/hf_models/models/swiss-ai/Apertus-v1.5-70B
  trust_remote_code: true
  draft_model_config: configs/eagle/draft-e3-config.json
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  norm_key: model.language_model.norm.weight
  freeze_lm_head: false
  target_model_backend: vllm
  # TorchSpec decoder-layer indices. The vLLM engine shifts these +1 to mixin
  # ids (2, 40, 77). Do not pass the mixin ids here or they become (3, 41, 78).

dataset:
  train_data_path: results/eagle/data/torchspec/overfit.jsonl
  eval_data_path: results/eagle/data/torchspec/overfit.jsonl
  chat_template: apertus
  renderer: apertus
  prompt_key: conversations
  last_turn_loss_only: true
  shuffle_dataset: true
  length_group_size: 1

training:
  attention_backend: sdpa
  micro_batch_size: 1
  draft_accumulation_steps: 1
  learning_rate: 1.0e-4
  max_grad_norm: 0.5
  max_seq_length: 4096
  num_epochs: 50
  num_train_steps: 200
  seed: 1
  training_num_gpus_per_node: 4
  training_num_nodes: 1
  ttt_length: 7
  warmup_ratio: 0.015
  save_interval: 50
  eval_interval: 50
  loss_type: forward_kl

inference:
  inference_engine_type: vllm
  inference_num_gpus: 4
  inference_num_gpus_per_engine: 4
  inference_num_gpus_per_node: 4
  inference_batch_size: 1
  inference_buffer_threshold: 2
  max_sample_pool_size: 8
  last_hidden_states_prenorm: true
  aux_hidden_states_layers: [1, 39, 76]
  vllm:
    tp_size: 4
    mem_fraction_static: 0.55
    extra_args:
      trust_remote_code: true
      max_model_len: 4096
      enforce_eager: true
      max_num_batched_tokens: 4096
  offline:
    data_path: results/eagle/replay/overfit-e3
    num_engines: 1

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 16GB
  local_buffer_size: 4GB
  hidden_dim: 8192

output_dir: results/eagle/checkpoints/e3-overfit
cache_dir: results/eagle/cache/e3-overfit

limits:
  max_optimizer_steps_pilot: 2000
  max_epochs_substantive: 3
  stop_after_evals_without_improvement: 3
  accumulation_field: training.draft_accumulation_steps
  accumulation_semantics: audit_before_launch_per_rank_vs_global
