schema_version: 1
project: apertus-v1.5-speculative-decoding

environment:
  cluster: clariden
  hardware: 1x GH200 node (4 GPUs)
  target_tensor_parallel_size: 4
  model_launch_revision: 909026a990454557f1b54d26f24ec3ad92e51e35
  vllm_revision: a601a9d998ddeb488f0c17e8512874b116aa7658
  target_model: /capstor/store/cscs/swissai/infra01/hf_models/models/swiss-ai/Apertus-v1.5-70B
  draft_model: /capstor/store/cscs/swissai/infra01/hf_models/models/swiss-ai/Apertus-v1.5-8B
  # The drafter's weights leave too little room to reserve KV cache for one
  # 262144-token request, and no workload exceeds 65,536 input tokens.
  max_model_len: 131072
  gpu_memory_utilization: 0.8

factors:
  methods:
    - method: none
      name: baseline
    - method: draft_model
      num_speculative_tokens: [2, 3, 5, 8]
      # draft_tensor_parallel_size=1 is not servable at the pinned vLLM revision:
      # DraftModelProposer asserts draft TP == target TP because all ranks would
      # compile the draft model as rank 0 and corrupt the torch.compile cache.
      # See results/deployment-failures/draft-n3-tp1-3392110/. Restore the [1, 4]
      # sweep only against a revision that implements mismatched draft TP.
      draft_tensor_parallel_size: [4]
    - method: ngram
      num_speculative_tokens: [2, 3, 5, 8]
      prompt_lookup_min: 1
      prompt_lookup_max: 4
  workloads:
    - open_chat
    - code
    - long_context_summarization
  generation:
    temperature: 0.0
    top_p: 1.0
    seed: 1
    ignore_eos: false

design:
  screening:
    concurrency: [1, 8]
    independent_deployment_repeats: 2
    purpose: eliminate consistently slower configurations
  confirmation:
    concurrency: [1, 8, 32]
    independent_deployment_repeats: 5
    purpose: compare baseline, n-gram, and selected draft candidates with confidence intervals
  capacity:
    arrival_process: poisson
    tool: swiss-ai/bench-agent
    purpose: compare sustainable request rate at fixed TTFT, TPOT, and error gates

validity_gates:
  minimum_success_rate: 0.99
  require_usage_in_stream: true
  require_non_decreasing_prometheus_counters: true
  maximum_repeat_spread_fraction: 0.10
  # Exact greedy agreement was the gate until 2026-09-13 and cannot pass across
  # independently launched deployments: one deployment serves exactly one
  # speculative configuration, and the per-step token budget and async scheduling
  # change with `method`, so batch shapes and reduction orders differ by
  # construction. Two identically configured draft deployments matched on 0 of 6
  # prompts. The gate now judges baseline-vs-speculative divergence against a
  # same-configuration control instead; see docs/protocol.md.
  greedy_correctness:
    criterion: calibrated_greedy_divergence
    require_calibration_control: true
    require_cross_deployment_control: true
    common_prefix_fraction_margin: 0.05
    normalized_edit_distance_margin: 0.05
    completion_token_difference_margin: 2
    gate_exact_match: false

extensions:
  - temperature_0.8
  - thinking_variant
  - kv_cache_capacity_and_max_concurrency
  - gpu_kernel_profile_of_winner_and_baseline
